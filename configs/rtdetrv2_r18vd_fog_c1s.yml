__include__: [
  '../dataset/fog_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]

output_dir: /home/ubuntu/ws/runs/c1s_fog

model: RTDETRFront

RTDETRFront:
  backbone: PResNet
  encoder: HybridEncoder
  decoder: RTDETRTransformerv2
  front_hidden: 32
  alpha: 0.5
  beta: 0.1
  gamma: 0.3

PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: True

HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5

RTDETRTransformerv2:
  num_layers: 3
